# ============================================================
#  AGROVER MR 25.26 — Paramètres SLAM Toolbox
#  Mode : Online Asynchronous (recommandé pour RPi 4)
# ============================================================

slam_toolbox:
  ros__parameters:

    # Plugin SLAM
    solver_plugin         : solver_plugins::CeresSolver
    ceres_linear_solver   : SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner  : SCHUR_JACOBI
    ceres_trust_strategy  : LEVENBERG_MARQUARDT

    # Mode
    mode: mapping    # 'mapping' pour créer une carte, 'localization' pour se localiser sur une carte existante

    # Topics et frames
    odom_frame        : odom
    map_frame         : map
    base_frame        : base_link
    scan_topic        : /scan
    use_map_saver     : true
    map_file_name     : /home/rover/maps/agrover_map

    # Fréquence et temps
    transform_publish_period : 0.02   # 50 Hz
    map_update_interval      : 5.0    # secondes
    resolution               : 0.05   # 5cm par cellule

    # Paramètres LiDAR (RPLIDAR A1)
    max_laser_range          : 8.0    # mètres (RPLIDAR A1 max 12m)
    minimum_time_interval    : 0.5
    transform_timeout        : 0.2
    tf_buffer_duration       : 30.0

    # Fermeture de boucles
    do_loop_closing          : true
    loop_match_minimum_chain_size  : 10
    loop_match_maximum_variance_covariance : 3.0

    # Paramètres corrélation scan
    correlation_search_space_dimension    : 0.5
    correlation_search_space_resolution   : 0.01
    correlation_search_space_smear_deviation : 0.1
